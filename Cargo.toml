[package]
name = "phaedrus"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Research-feed MCP server: literature-watch findings, watchlist, and revenue-candidate drafts."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WS2 (D-113): framing moves to the official Rust MCP SDK, modern era
# only (2026-07-28). The version pin is the fleet pin — one rmcp
# version across every estate server; bumps are single fleet events.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
lto = true
